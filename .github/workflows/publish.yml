name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # The native addon is the whole reason a workspace indexes in seconds instead of minutes, and until
  # this job existed it was also the reason npm users never got it: `artifacts/` is gitignored, so the
  # published package shipped only the JS path. One binary per platform, published as its own optional
  # dependency, is how `pnpm add` ends up with the one the machine can actually `dlopen`.
  build-native:
    strategy:
      # A missing platform must not silently produce a release that lacks that platform's binary:
      # fail the run instead, so the release is retried rather than half-published.
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: darwin-arm64
          # Intel macOS, cross-compiled on the arm64 runner. `macos-13` (the last Intel image) sat
          # queued for 14 minutes and blocked a release; `x86_64-apple-darwin` is a supported rustc
          # target from an arm64 host, and dtolnay/rust-toolchain installs it via `targets:`.
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: darwin-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64-gnu
          # arm64 Linux needs an arm64 runner: cross-compiling a cdylib whose tree-sitter C sources
          # are compiled by a C toolchain of the wrong architecture is not a supported build.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: win32-x64-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `-p @napi-rs/cli` is load-bearing: the package's binary is named `napi`, and npm cannot infer
      # it from the bare package name (`could not determine executable to run`).
      - name: Build addon
        working-directory: crates/indexer-rust
        run: npx --yes -p @napi-rs/cli napi build --release --platform --target ${{ matrix.target }} --output-dir artifacts

      - name: Stage the binary into its platform package
        shell: bash
        run: |
          set -euo pipefail
          dir="crates/indexer-rust/npm/${{ matrix.suffix }}"
          mkdir -p "$dir"
          cp "crates/indexer-rust/artifacts/codegraph-indexer.${{ matrix.suffix }}.node" "$dir/"
          ls -l "$dir"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.suffix }}
          path: crates/indexer-rust/npm/${{ matrix.suffix }}/*.node
          if-no-files-found: error

  publish:
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      # Required for npm provenance: mints the OIDC token that lets npm attest
      # this tarball was built from this repo at this commit. Without it the
      # publish still succeeds, but silently drops the provenance badge.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          path: native-artifacts

      # Every platform package must carry its binary before anything is published: a platform package
      # whose `.node` is missing installs cleanly and then falls back to JS forever, which is exactly
      # the silent failure this release is meant to remove.
      - name: Place the binaries
        shell: bash
        run: |
          set -euo pipefail
          # The artifact name carries the `native-` tag it was uploaded under; the package directory
          # does not. Stripping it here is what keeps the two names from being confused.
          for dir in native-artifacts/*/; do
            name="$(basename "$dir")"
            suffix="${name#native-}"
            cp "$dir"*.node "crates/indexer-rust/npm/$suffix/"
          done
          for pkg in crates/indexer-rust/npm/*/; do
            count=$(find "$pkg" -maxdepth 1 -name '*.node' | wc -l)
            echo "$pkg -> $count binary(ies)"
            if [ "$count" -ne 1 ]; then
              echo "::warning::$pkg has no binary and will not be published; that platform falls back to the JS engine"
            fi
          done

      # Platform packages go first, before the install: the main packages name them as optional
      # dependencies, so a frozen install cannot resolve until those packages exist on the registry.
      # A re-run after a partial publish finds them already present — that is a success, not a failure,
      # which is why the "already published" message is tolerated here.
      - name: Publish platform packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          set -uo pipefail
          for pkg in crates/indexer-rust/npm/*/; do
            if [ "$(find "$pkg" -maxdepth 1 -name '*.node' | wc -l)" -ne 1 ]; then
              echo "skipping $pkg (no binary in this run)"
              continue
            fi
            echo "publishing $pkg"
            if ! npm publish "$pkg" --access public 2>&1 | tee /tmp/pub.log; then
              if grep -qE "previously published|cannot publish over" /tmp/pub.log; then
                echo "$pkg already at this version; continuing"
              else
                exit 1
              fi
            fi
          done

      # Not frozen: the optional platform packages were only just published, so the lockfile this
      # checkout carries predates them. CI does not commit the lockfile, and every other dependency
      # is still pinned by it.
      # The release publishes its own platform packages, so pnpm's freshness window is not a
      # supply-chain risk here — it is the thing being published. Without this, a run fails on
      # lockfile entries for packages published minutes ago by the *previous* release.
      - run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      # Publishing an artifact that does not typecheck or pass its own tests is
      # not recoverable: npm forbids re-using a version number.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      # The bundle is what users install, so its npm page must render the
      # project README. Copied at publish time rather than committed, so the
      # two can never drift apart.
      - name: Stage bundle README
        run: cp README.md packages/bundle/README.md

      # `pnpm -r publish` walks the workspace in dependency order and rewrites
      # every `workspace:^` range into the concrete published version.
      - name: Publish
        run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
